<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1F23"/>
      <stop offset="100%" stop-color="#14171A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22272C" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#g)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="0" y="0" width="800" height="56" fill="#1B1F23"/>
  <rect x="0" y="55" width="800" height="1" fill="#2C3237"/>
  <circle cx="34" cy="28" r="6" fill="#E2803A"/>
  <text x="54" y="34" font-family="IBM Plex Mono, monospace" font-size="16" fill="#F2EFE9">Masitsa Motors</text>
  <text x="700" y="34" font-family="IBM Plex Mono, monospace" font-size="12" fill="#6E767C">Browse · Sell · Contact</text>

  <!-- car silhouette -->
  <g transform="translate(150,200)">
    <path d="M20 140 L40 90 Q60 60 110 55 L360 55 Q410 60 430 90 L450 140 L450 170 L20 170 Z"
          fill="none" stroke="#5B8DBE" stroke-width="3"/>
    <circle cx="100" cy="170" r="28" fill="#14171A" stroke="#E2803A" stroke-width="4"/>
    <circle cx="370" cy="170" r="28" fill="#14171A" stroke="#E2803A" stroke-width="4"/>
    <path d="M110 55 L140 95 L330 95 L360 55" fill="none" stroke="#5B8DBE" stroke-width="3"/>
    <line x1="20" y1="140" x2="450" y2="140" stroke="#5B8DBE" stroke-width="3"/>
  </g>

  <text x="400" y="440" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="#A7AEB4">
    Premium Car Dealership &amp; Imports · Nairobi, Kenya
  </text>
